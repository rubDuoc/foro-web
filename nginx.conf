# ============================================================
# Foro Conecta - Nginx para la SPA Angular
# Plantilla: al iniciar el contenedor se reemplaza ${PORT} por el puerto del entorno.
# ============================================================
server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Archivos estaticos con cache (Angular les agrega un hash al nombre)
  location ~* \.(js|css|svg|png|ico|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # Fallback de SPA: /temas/3, /perfil, /admin/... no existen como archivos;
  # se entrega index.html y el enrutador de Angular muestra la pagina correcta.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
