<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Comunidad conversando">
  <title>Comunidad conversando</title>
  <!-- Ilustracion propia de la portada: personas conectadas por globos de conversacion -->
  <circle cx="200" cy="150" r="130" fill="#ffffff" opacity="0.12"/>
  <path d="M110 120 C150 70, 250 70, 290 120" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.7"/>
  <path d="M110 190 C150 240, 250 240, 290 190" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.7"/>
  <!-- persona 1 -->
  <circle cx="95" cy="140" r="22" fill="#FFD5CF"/>
  <rect x="68" y="166" width="54" height="50" rx="22" fill="#FF6B5B"/>
  <!-- persona 2 -->
  <circle cx="305" cy="140" r="22" fill="#FFE8B5"/>
  <rect x="278" y="166" width="54" height="50" rx="22" fill="#ffffff"/>
  <!-- persona 3 -->
  <circle cx="200" cy="200" r="22" fill="#D9D8FF"/>
  <rect x="173" y="226" width="54" height="50" rx="22" fill="#2B2A78"/>
  <!-- globos -->
  <rect x="120" y="40" width="80" height="46" rx="14" fill="#ffffff"/>
  <path d="M140 86 L136 100 L152 86 Z" fill="#ffffff"/>
  <circle cx="145" cy="63" r="5" fill="#3F3D9E"/>
  <circle cx="160" cy="63" r="5" fill="#3F3D9E"/>
  <circle cx="175" cy="63" r="5" fill="#3F3D9E"/>
  <rect x="215" y="70" width="80" height="40" rx="14" fill="#FF6B5B"/>
  <path d="M270 110 L276 122 L258 110 Z" fill="#FF6B5B"/>
  <rect x="228" y="84" width="40" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="228" y="95" width="26" height="5" rx="2.5" fill="#ffffff"/>
</svg>
